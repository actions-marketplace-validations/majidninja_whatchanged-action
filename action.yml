name: 'whatchanged timeline'
description: 'Timeline of what changed on the runner: packages, /etc edits, systemd units, cron and shell rc files'
author: 'majidninja'
branding:
  icon: 'clock'
  color: 'blue'

inputs:
  mode:
    description: '"start" remembers the current time for a later report; "report" prints the timeline'
    required: false
    default: 'report'
  since:
    description: 'Start of the timeline (any whatchanged --since value: 30m, 2h, 1d, "2024-05-01 09:00"). Defaults to the time saved by a "start" step, else 1h.'
    required: false
    default: ''
  version:
    description: '"latest" (newest release), a release tag such as v0.1.0, or a branch/commit to build from source'
    required: false
    default: 'latest'
  sudo:
    description: 'Run with sudo (when it works without a password) so root-only files can be read'
    required: false
    default: 'true'
  summary:
    description: 'Write the timeline to the job summary'
    required: false
    default: 'true'

outputs:
  timeline:
    description: 'Path to a file with the timeline text'
    value: ${{ steps.report.outputs.timeline }}
  changes:
    description: 'Number of timeline lines (0 when nothing changed)'
    value: ${{ steps.report.outputs.changes }}

runs:
  using: 'composite'
  steps:
    - name: Mark start time
      if: inputs.mode == 'start'
      shell: bash
      run: |
        echo "WHATCHANGED_SINCE=$(date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
        echo "whatchanged: timeline will start at $(date '+%Y-%m-%d %H:%M')"

    - name: Check mode and platform
      if: inputs.mode != 'start'
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
      run: |
        if [ "$INPUT_MODE" != report ]; then
          echo "::error::whatchanged-action: mode must be 'start' or 'report', got '$INPUT_MODE'"; exit 1
        fi
        if [ "$RUNNER_OS" != Linux ]; then
          echo "::error::whatchanged-action only works on Linux runners"; exit 1
        fi

    - name: Resolve whatchanged version
      id: ver
      if: inputs.mode != 'start'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        repo=majidninja/whatchanged
        ref="$INPUT_VERSION"
        if [ "$ref" = latest ]; then
          ref=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/releases/latest" \
                | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1) || true
          [ -n "$ref" ] || ref=main
        fi
        if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
          sha="$ref"
        else
          sha=$(git ls-remote "https://github.com/$repo.git" "$ref" "$ref^{}" | tail -1 | cut -f1)
        fi
        [ -n "$sha" ] || { echo "::error::whatchanged-action: unknown version '$INPUT_VERSION'"; exit 1; }
        case "$RUNNER_ARCH" in
          X64) target=x86_64-unknown-linux-musl ;;
          ARM64) target=aarch64-unknown-linux-musl ;;
          *) target= ;;
        esac
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "target=$target" >> "$GITHUB_OUTPUT"
        echo "whatchanged: using $ref ($sha)"

    - name: Restore cached binary
      id: cache
      if: inputs.mode != 'start'
      uses: actions/cache@v4
      with:
        path: ~/.whatchanged-bin
        key: whatchanged-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.sha }}

    - name: Download release binary
      id: download
      if: inputs.mode != 'start' && steps.cache.outputs.cache-hit != 'true' && steps.ver.outputs.target != ''
      shell: bash
      env:
        REF: ${{ steps.ver.outputs.ref }}
        TARGET: ${{ steps.ver.outputs.target }}
      run: |
        name="whatchanged-$REF-$TARGET"
        url="https://github.com/majidninja/whatchanged/releases/download/$REF/$name.tar.gz"
        tmp=$(mktemp -d)
        cd "$tmp"
        if curl -fsSLO "$url" && curl -fsSLO "$url.sha256"; then
          sha256sum -c "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz"
          mkdir -p "$HOME/.whatchanged-bin/bin"
          install "$name/whatchanged" "$HOME/.whatchanged-bin/bin/whatchanged"
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "whatchanged: downloaded $name"
        else
          echo "whatchanged: no release binary for $REF on $TARGET, building from source"
        fi

    - name: Build whatchanged
      if: inputs.mode != 'start' && steps.cache.outputs.cache-hit != 'true' && steps.download.outputs.ok != 'true'
      shell: bash
      env:
        SHA: ${{ steps.ver.outputs.sha }}
      run: |
        command -v cargo >/dev/null || { echo "::error::whatchanged-action needs cargo (Rust 1.85+) to build $SHA from source"; exit 1; }
        cargo install --quiet --locked --git https://github.com/majidninja/whatchanged.git --rev "$SHA" --root "$HOME/.whatchanged-bin" whatchanged

    - name: Report
      id: report
      if: inputs.mode != 'start'
      shell: bash
      env:
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_SUDO: ${{ inputs.sudo }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        since="${INPUT_SINCE:-${WHATCHANGED_SINCE:-1h}}"
        bin="$HOME/.whatchanged-bin/bin/whatchanged"
        out="$RUNNER_TEMP/whatchanged.txt"
        if [ "$INPUT_SUDO" = true ] && command -v sudo >/dev/null && sudo -n true 2>/dev/null; then
          sudo "$bin" --since "$since" > "$out"
        else
          "$bin" --since "$since" > "$out"
        fi
        cat "$out"
        changes=$(grep -cE '^ +[0-9]{2}:[0-9]{2} ' "$out" || true)
        echo "timeline=$out" >> "$GITHUB_OUTPUT"
        echo "changes=$changes" >> "$GITHUB_OUTPUT"
        if [ "$INPUT_SUMMARY" = true ]; then
          {
            echo "### What changed on the runner since $since"
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
